name: Apply wedding theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link shared stylesheet to all HTML pages
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            if ! grep -q 'href="style.css"' "$file"; then
              python3 - "$file" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
s = p.read_text(encoding='utf-8')
if 'href="style.css"' not in s and '</head>' in s:
    s = s.replace('</head>', '<link rel="stylesheet" href="style.css"></head>', 1)
    p.write_text(s, encoding='utf-8')
PY
              changed=1
            fi
          done < <(find . -maxdepth 1 -type f -name '*.html' -print0)

          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "Apply shared Puglia wedding theme to all pages"
            git push
          fi
