name: Update city QR cards

on:
  push:
    branches: [main]
    paths-ignore:
      - 'qr-*.png'
      - 'IMAGE-CREDITS.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow qrcode requests

      - name: Generate QR cards and fix navigation
        run: python scripts/update_city_qrs.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr-*.png IMAGE-CREDITS.txt *.html
          git diff --cached --quiet || git commit -m "Update city QR cards and navigation [skip ci]"
          git push
